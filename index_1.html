<!DOCTYPE html>
<html lang="zh-CN">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    box-sizing: border-box;
    --color-bg: #FFFDF6;
    --color-bg-alt: #FFF6E4;
    --color-card: #FFFFFF;
    --color-track: #FF6B5E;
    --color-sky: #2D9CDB;
    --color-sun: #FDBA2D;
    --color-grass: #3FB27F;
    --color-ink: #1B2A4A;
    --color-ink-soft: #5B6B8C;
    --color-line: #F0E6D2;
    --color-gold: #E8A200;
    --color-gold-bg: #FFF3D6;
    --color-silver: #7C8798;
    --color-silver-bg: #EEF1F4;
    --color-bronze: #B5651D;
    --color-bronze-bg: #FBE8D9;
    --glass-bg: rgba(255, 255, 255, 0.5);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-highlight: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 12px 36px -16px rgba(27, 42, 74, 0.35);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #14192B;
      --color-bg-alt: #1C2340;
      --color-card: #202748;
      --color-track: #FF8479;
      --color-sky: #5CB6F5;
      --color-sun: #FFCB57;
      --color-grass: #5FCB9B;
      --color-ink: #F1F3FA;
      --color-ink-soft: #A7B0CC;
      --color-line: #313B63;
      --color-gold: #F6C445;
      --color-gold-bg: #3A3018;
      --color-silver: #B7C0D6;
      --color-silver-bg: #2A314E;
      --color-bronze: #E29A5E;
      --color-bronze-bg: #3A2A1C;
      --glass-bg: rgba(32, 39, 72, 0.48);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 12px 36px -16px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #14192B;
    --color-bg-alt: #1C2340;
    --color-card: #202748;
    --color-track: #FF8479;
    --color-sky: #5CB6F5;
    --color-sun: #FFCB57;
    --color-grass: #5FCB9B;
    --color-ink: #F1F3FA;
    --color-ink-soft: #A7B0CC;
    --color-line: #313B63;
    --color-gold: #F6C445;
    --color-gold-bg: #3A3018;
    --color-silver: #B7C0D6;
    --color-silver-bg: #2A314E;
    --color-bronze: #E29A5E;
    --color-bronze-bg: #3A2A1C;
    --glass-bg: rgba(32, 39, 72, 0.48);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-highlight: rgba(255, 255, 255, 0.1);
    --glass-shadow: 0 12px 36px -16px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    position: relative;
    overflow-x: hidden;
  }
  html, body { height: 100%; }

  .display { font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; }

  /* ---------- Liquid glass backdrop ---------- */
  .bg-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg-blobs span { position: absolute; display: block; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
  .bg-blobs span:nth-child(1) { width: 340px; height: 340px; top: -80px; left: -60px; background: var(--color-sky); }
  .bg-blobs span:nth-child(2) { width: 300px; height: 300px; top: 220px; right: -100px; background: var(--color-sun); opacity: 0.5; }
  .bg-blobs span:nth-child(3) { width: 320px; height: 320px; bottom: 60px; left: -80px; background: var(--color-grass); opacity: 0.4; }
  .bg-blobs span:nth-child(4) { width: 260px; height: 260px; bottom: -100px; right: 10%; background: var(--color-track); opacity: 0.35; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 34px 20px 30px;
    background: linear-gradient(160deg, var(--color-sky) 0%, #3FA9E8 55%, var(--color-grass) 130%);
    color: #fff;
  }
  .lanes {
    position: absolute; inset: 0; opacity: 0.16;
    background: repeating-linear-gradient(180deg, transparent 0 34px, #fff 34px 38px);
    transform: skewY(-3deg) scale(1.2);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 5px 14px 5px 10px;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    backdrop-filter: blur(2px);
  }
  .hero-eyebrow .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--color-sun);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.35);
  }
  .hero h1 {
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 12vw, 54px);
    line-height: 1.05;
    margin: 14px 0 4px;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .hero p { margin: 0; font-size: 15px; opacity: 0.95; max-width: 30em; }

  /* ---------- Stat strip ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 16px 20px 4px;
    margin-top: -26px;
    position: relative;
    z-index: 2;
  }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(5, 1fr); } }
  .stat-card {
    background: var(--glass-bg);
    border-radius: 16px;
    padding: 14px 14px 12px;
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }
  .stat-card .num { font-family: "ZCOOL KuaiLe", sans-serif; font-size: 26px; line-height: 1; }
  .stat-card .label { font-size: 12.5px; color: var(--color-ink-soft); margin-top: 6px; }
  .stat-card.gold .num { color: var(--color-gold); }
  .stat-card.silver .num { color: var(--color-silver); }
  .stat-card.bronze .num { color: var(--color-bronze); }
  .stat-card.score .num { color: var(--color-track); }
  .stat-card.total .num { color: var(--color-sky); }

  /* ---------- Main ---------- */
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
  section + section { margin-top: 26px; }

  .section-title {
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 21px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .bib {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--color-sun); color: #55380a;
    font-family: "Noto Sans SC", sans-serif; font-weight: 900; font-size: 13px;
    flex-shrink: 0;
  }

  /* ---------- List ---------- */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--color-ink-soft);
    background: var(--glass-bg);
    border: 1.5px dashed var(--glass-border);
    border-radius: 18px;
    font-size: 14px;
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
  }
  .empty-state .emoji { font-size: 30px; display: block; margin-bottom: 8px; }
  .empty-state code {
    display: block; margin-top: 10px; font-size: 12px;
    color: var(--color-ink-soft); opacity: 0.8;
  }

  .entry-list { display: flex; flex-direction: column; gap: 10px; }
  .entry {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 12px 12px 12px 6px;
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
  }
  .medal {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 15px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    margin-top: 1px;
  }
  .medal.gold { background: var(--color-gold-bg); color: var(--color-gold); }
  .medal.silver { background: var(--color-silver-bg); color: #556174; }
  .medal.bronze { background: var(--color-bronze-bg); color: var(--color-bronze); }
  .medal.join { background: rgba(63,178,127,0.14); color: var(--color-grass); }

  .entry-body { flex: 1; min-width: 0; }
  .entry-name {
    font-weight: 700;
    font-size: 15px;
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
    line-height: 1.35;
  }
  .entry-meta {
    font-size: 12.5px;
    color: var(--color-ink-soft);
    margin-top: 2px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .entry-score {
    flex-shrink: 0;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 18px;
    color: var(--color-sky);
    min-width: 44px;
    text-align: right;
    margin-top: 2px;
  }
  .entry-score span { font-size: 11px; font-family: "Noto Sans SC", sans-serif; color: var(--color-ink-soft); display:block; }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--color-ink-soft);
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div class="hero">
  <div class="lanes"></div>
  <div class="hero-inner">
    <span class="hero-eyebrow"><span class="dot"></span>校运动会 · 荣誉榜</span>
    <h1 class="display">2901班</h1>
    <p>记录每一次冲刺与跳跃，见证 2901 班在运动会上赢得的每一枚奖牌。</p>
  </div>
</div>

<div class="stats">
  <div class="stat-card total"><div class="num" id="stat-total">0</div><div class="label">获奖项目</div></div>
  <div class="stat-card gold"><div class="num" id="stat-gold">0</div><div class="label">金牌 🥇</div></div>
  <div class="stat-card silver"><div class="num" id="stat-silver">0</div><div class="label">银牌 🥈</div></div>
  <div class="stat-card bronze"><div class="num" id="stat-bronze">0</div><div class="label">铜牌 🥉</div></div>
  <div class="stat-card score"><div class="num" id="stat-score">0</div><div class="label">团体总分</div></div>
</div>

<main>
  <section>
    <h2 class="section-title"><span class="bib">🏆</span>获奖记录</h2>
    <div id="list-wrap"></div>
  </section>
</main>

<footer>2901 班 · 运动会获奖统计</footer>

<script>
/* ============================================================
   在这里直接添加获奖记录，改完保存文件、重新上传到 GitHub 即可。
   每一项格式：
   {
     project: '比赛项目',      // 例如 '男子 100 米'
     student: '获奖同学',      // 可以写多个名字，例如 '张三、李四'
     rank:    'gold',         // 'gold' 金牌 / 'silver' 银牌 / 'bronze' 铜牌 / 'join' 参与奖
     score:   8,              // 团体积分，数字
     note:    ''              // 备注，可留空 ''
   }
   项与项之间用逗号隔开，下面先给你留了两个例子，删掉换成你自己的就行。
   ============================================================ */
var ENTRIES = [
        {
    "project": "4×400米",
    "student": "李朝兴、王胜锐、曾玥慈、钟依玲",
    "rank": "join",
    "score": 1,
    "note": "第 7 名",
    "createdAt": 1790152072894,
    "id": "1790152072894-1xd11"
  },
    {
    "project":'男子 4×100 米接力',
    "student":'王乐嘉、马鹤津、李朝兴、王胜锐',
    "rank":'join',
    "score":'1',
    "note":'小组第 4 名'
  },
  {
    "project": "女子 4×100米",
    "student": "邵暄淇、曾玥慈、陈欣然、钟依玲",
    "rank": "join",
    "score": 1,
    "note": "第 5 名",
    "createdAt": 1790152072894,
    "id": "1790152072894-1xd11"
  },
    {
    "project":'男子 1500 米',
    "student":'张巍然',
    "rank":'join',
    "score":'1',
    "note":'第 4 名'
  },
    {
    "project": "女子 1500 米",
    "student": "邵暄淇",
    "rank": "bronze",
    "score": 3,
    "note": "第 3 名"
  },
  {
    "project": "男子 800 米",
    "student": "宋雨苏",
    "rank": "join",
    "score": 1,
    "note": "第 6 名"
  },
      {
    "project": "女子 800 米",
    "student": "罗婧瑄",
    "rank": "join",
    "score": 1,
    "note": "第 5 名",
    "createdAt": 1790150484565,
    "id": "1790150484565-ram7y"
  },
    {
    "project":'女子 100 米',
    "student":'曾玥慈',
    "rank":'join',
    "score":'1',
    "note":'第 6 名'
  },
    {
    "project":'男子跳高',
    "student":'王胜锐',
    "rank":'join',
    "score":'1',
    "note":'第 5 名'
  },
  {
    "project": "女子跳远",
    "student": "吴昱莹",
    "rank": "gold",
    "score": 8,
    "note": "第 1 名"
  },
  {
    "project": "女子跳高",
    "student": "张飘月",
    "rank": "join",
    "score": 1,
    "note": "第 4 名"
  },

  {
    "project":'女子跳高',
    "student":'曾玥慈',
    "rank":'join',
    "score":'1',
    "note":'第 5 名'
  },

  
  {
    "project": "赛龙舟",
    "student": "左屹珊、冯赞、刘一诺、朴逸恒、李宸瀚、颜智帅",
    "rank": "bronze",
    "score": 1,
    "note": "并列第 3 名"
  },
{
    "project":'搭桥过河',
    "student":'陈欣然、左屹珊、罗婧瑄、张飘月',
    "rank":'join',
    "score":'1',
    "note":'第 4 名'
  },

];

(function () {
  var RANKS = {
    gold:   { label: '金牌', emoji: '🥇', cls: 'gold' },
    silver: { label: '银牌', emoji: '🥈', cls: 'silver' },
    bronze: { label: '铜牌', emoji: '🥉', cls: 'bronze' },
    join:   { label: '优胜奖', emoji: '🎖️', cls: 'join' }
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === 'class') node.className = attrs[k];
        else if (k === 'text') node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  function renderStats() {
    var counts = { gold: 0, silver: 0, bronze: 0 };
    var totalScore = 0;
    ENTRIES.forEach(function (e) {
      if (counts[e.rank] !== undefined) counts[e.rank]++;
      totalScore += Number(e.score) || 0;
    });
    document.getElementById('stat-total').textContent = ENTRIES.length;
    document.getElementById('stat-gold').textContent = counts.gold;
    document.getElementById('stat-silver').textContent = counts.silver;
    document.getElementById('stat-bronze').textContent = counts.bronze;
    document.getElementById('stat-score').textContent = totalScore;
  }

  function renderList() {
    var wrap = document.getElementById('list-wrap');
    wrap.innerHTML = '';

    if (ENTRIES.length === 0) {
      wrap.appendChild(el('div', { class: 'empty-state' }, [
        el('span', { class: 'emoji', text: '🏁' }),
        el('div', { text: '还没有获奖记录' }),
        el('code', { text: '' })
      ]));
      return;
    }

    var list = el('div', { class: 'entry-list' });

    ENTRIES.forEach(function (entry) {
      var rankInfo = RANKS[entry.rank] || RANKS.join;
      var medal = el('div', { class: 'medal ' + rankInfo.cls, text: rankInfo.emoji });

      var metaParts = [entry.project || '未命名项目', rankInfo.label];
      if (entry.note) metaParts.push(entry.note);
      var meta = el('div', { class: 'entry-meta' });
      metaParts.forEach(function (m, i) {
        meta.appendChild(el('span', { text: i === metaParts.length - 1 ? m : m + ' ·' }));
      });

      var body = el('div', { class: 'entry-body' }, [
        el('div', { class: 'entry-name', text: entry.student || '未填写姓名' }),
        meta
      ]);

      var scoreLabel = el('span', { text: '积分' });
      var score = el('div', { class: 'entry-score', text: String(entry.score || 0) }, [scoreLabel]);

      list.appendChild(el('div', { class: 'entry' }, [medal, body, score]));
    });

    wrap.appendChild(list);
  }

  renderStats();
  renderList();
})();
</script>

</body>
</html>
