<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多媒体播放器</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--line:#d9dee6;--fg:#1c2230;--dim:#667085;--acc:#1a73e8;--btn:#eef1f5;--cur:#e3efff;--onacc:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--panel:#1d2027;--line:#2c313b;--fg:#e6e8ee;--dim:#8b92a1;--acc:#5aa9ff;--btn:#262a33;--cur:#223347;--onacc:#04121f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1d2027;--line:#2c313b;--fg:#e6e8ee;--dim:#8b92a1;--acc:#5aa9ff;--btn:#262a33;--cur:#223347;--onacc:#04121f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;display:flex;justify-content:center;padding:16px}
#app{width:100%;max-width:900px;display:flex;flex-direction:column;gap:12px}
#stage{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;background:#000}
#stage.noVideo #video{visibility:hidden}
#art{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim)}
#stage.noVideo #art{display:flex}
#art .ic{font-size:64px}
#sub{position:absolute;left:5%;right:5%;bottom:6%;text-align:center;font-size:clamp(16px,2.6vw,26px);line-height:1.35;color:#fff;white-space:pre-line;text-shadow:0 0 4px #000,0 0 4px #000,1px 1px 2px #000;pointer-events:none}
#stage:fullscreen{border-radius:0}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,label.btn{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}
#seek{flex:1 1 100%}
#time{color:var(--dim);font-variant-numeric:tabular-nums;min-width:96px}
#title{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{color:var(--dim);font-size:12px;width:100%}
#list{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
#list li{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px}
#list li:hover{background:var(--btn)}
#list li.cur{background:var(--cur);color:var(--acc)}
#list .tag{color:var(--dim);font-size:12px;margin-left:auto}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="noVideo">
    <video id="video" playsinline></video>
    <div id="art"><div class="ic">♪</div><div id="artName"></div></div>
    <div id="sub"></div>
  </div>

  <div class="bar">
    <div id="title">未加载</div>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <button id="prev" title="上一个">⏮</button>
    <button id="play" title="播放/暂停 (空格)">▶</button>
    <button id="next" title="下一个">⏭</button>
    <label>🔊 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" style="width:90px"></label>
    <select id="rate" title="倍速"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
    <button id="loop" class="on" title="列表循环">🔁</button>
    <button id="subBtn" class="on" title="显示/隐藏字幕">CC</button>
    <button id="theme" title="主题：自动 / 亮色 / 暗色">🌓</button>
    <button id="fs" title="全屏">⛶</button>
    <label class="btn">添加媒体<input id="fileMedia" type="file" multiple accept="video/*,audio/*,.mid,.midi,.kar,.webm,.mkv"></label>
    <label class="btn">加载字幕<input id="fileSub" type="file" accept=".srt,.vtt,.txt"></label>
    <div id="status"></div>
  </div>

  <div class="bar"><ul id="list" style="width:100%"></ul></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script>
/* ============ 播放列表：在这里添加路径 ============
   写法一：直接写路径字符串
   写法二：{ src:"路径", sub:"字幕路径(可选)", title:"显示名(可选)" }
   不写 sub 时，会自动尝试同名的 .vtt / .srt
   支持：mp4 / webm / mkv / ogv / mp3 / wav / ogg / m4a / flac / mid / midi
   注意：需要用本地服务器或 github.io 打开（直接双击 file:// 无法读取 assets）*/
const PLAYLIST = [
  "assets/Erika.mid",
  "assets/Runaway baby.webm"
  // "assets/song.mp3",
  // { src: "assets/movie.webm", sub: "assets/movie.vtt", title: "示例视频" },
];
/* ================================================= */

const $ = id => document.getElementById(id);
const video = $('video'), stage = $('stage'), subEl = $('sub');
const VID = ['mp4','webm','mkv','ogv','mov','m4v'];
const MID = ['mid','midi','kar'];
let items = PLAYLIST.map(p => typeof p === 'string' ? {src: p} : {...p});
let idx = -1, mode = 'media', cues = [], subOn = true, loopList = true, loadToken = 0;

// ---------- MIDI 引擎 ----------
const midi = {notes: [], dur: 0, playing: false, from: 0, wall0: 0, ptr: 0, synth: null, timer: null,
  time() { return this.playing ? Math.min(this.dur, this.from + (performance.now() - this.wall0) / 1000) : this.from; },
  async load(buf) {
    const M = window.Midi.Midi || window.Midi;
    const m = new M(buf);
    this.notes = m.tracks.filter(t => !t.instrument.percussion).flatMap(t => t.notes).sort((a, b) => a.time - b.time);
    this.dur = m.duration; this.from = 0; this.playing = false; this.ptr = 0;
  },
  seekPtr(t) { this.ptr = this.notes.findIndex(n => n.time >= t); if (this.ptr < 0) this.ptr = this.notes.length; },
  async play() {
    await Tone.start();
    if (!this.synth) {
      this.synth = new Tone.PolySynth(Tone.Synth, {maxPolyphony: 64,
        oscillator: {type: 'triangle'}, envelope: {attack: 0.01, decay: 0.2, sustain: 0.4, release: 0.4}}).toDestination();
      this.synth.volume.value = -8;
    }
    if (this.from >= this.dur) this.from = 0;
    this.seekPtr(this.from);
    this.wall0 = performance.now(); this.playing = true;
    clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 50);
    this.tick();
  },
  tick() {
    const now = this.time();
    while (this.ptr < this.notes.length && this.notes[this.ptr].time < now + 0.25) {
      const n = this.notes[this.ptr++], late = Math.max(0, now - n.time);
      const d = n.duration - late; if (d <= 0.01) continue;
      this.synth.triggerAttackRelease(n.name, d, Tone.now() + Math.max(0, n.time - now), n.velocity);
    }
  },
  pause() {
    if (this.playing) { this.from = this.time(); this.playing = false; }
    clearInterval(this.timer); if (this.synth) this.synth.releaseAll();
  },
  seek(t) {
    const was = this.playing; this.pause(); this.from = t;
    if (was) this.play();
  }
};

// ---------- 统一接口 ----------
const getTime = () => mode === 'midi' ? midi.time() : video.currentTime || 0;
const getDur = () => mode === 'midi' ? midi.dur : (isFinite(video.duration) ? video.duration : 0);
const isPlaying = () => mode === 'midi' ? midi.playing : !video.paused && !video.ended;
async function play() { if (idx < 0) return; try { mode === 'midi' ? await midi.play() : await video.play(); } catch (e) { say('播放失败：' + e.message); } }
function pause() { mode === 'midi' ? midi.pause() : video.pause(); }
function seek(t) { mode === 'midi' ? midi.seek(t) : (video.currentTime = t); }
function say(s) { $('status').textContent = s || ''; }
const fmt = s => { s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
const extOf = u => (u.split(/[?#]/)[0].split('.').pop() || '').toLowerCase();
const nameOf = it => it.title || decodeURIComponent((it.name || it.src).split(/[?#]/)[0].split('/').pop());

// ---------- 字幕 ----------
function parseSub(text) {
  const out = [];
  const ts = s => { const p = s.replace(',', '.').split(':').map(parseFloat); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };
  text.replace(/^\uFEFF/, '').replace(/\r/g, '').split(/\n{2,}/).forEach(block => {
    const lines = block.split('\n'), i = lines.findIndex(l => l.includes('-->'));
    if (i < 0) return;
    const m = lines[i].match(/((?:\d+:)?\d+:\d+[.,]\d+)\s*-->\s*((?:\d+:)?\d+:\d+[.,]\d+)/);
    if (!m) return;
    const t = lines.slice(i + 1).join('\n').replace(/<[^>]+>/g, '').replace(/\{\\[^}]*\}/g, '').trim();
    if (t) out.push({s: ts(m[1]), e: ts(m[2]), t});
  });
  return out.sort((a, b) => a.s - b.s);
}
async function loadSubUrl(url, token) {
  try {
    const r = await fetch(url); if (!r.ok) return false;
    const c = parseSub(await r.text());
    if (token !== loadToken || !c.length) return false;
    cues = c; say('字幕：' + url.split('/').pop() + '（' + c.length + ' 条）'); return true;
  } catch { return false; }
}
function renderSub() {
  if (!subOn) { subEl.textContent = ''; return; }
  const t = getTime();
  subEl.textContent = cues.filter(c => t >= c.s && t <= c.e).map(c => c.t).join('\n');
}

// ---------- 载入条目 ----------
async function loadItem(i, autoplay) {
  if (i < 0 || i >= items.length) return;
  const token = ++loadToken, it = items[i];
  pause(); video.removeAttribute('src'); video.load();
  idx = i; cues = []; subEl.textContent = ''; say('加载中…'); drawList();
  $('title').textContent = nameOf(it); $('artName').textContent = nameOf(it);
  const ext = extOf(it.name || it.src);
  try {
    if (MID.includes(ext)) {
      mode = 'midi'; stage.classList.add('noVideo');
      const buf = it.file ? await it.file.arrayBuffer() : await (await fetch(it.src)).arrayBuffer();
      if (token !== loadToken) return;
      await midi.load(buf); say('MIDI 已载入（合成音色，无音源库）');
    } else {
      mode = 'media';
      stage.classList.toggle('noVideo', !VID.includes(ext));
      video.src = it.src;
      await new Promise((ok, no) => { video.onloadedmetadata = ok; video.onerror = () => no(new Error('无法加载或不支持的格式')); });
      if (token !== loadToken) return;
      stage.classList.toggle('noVideo', !VID.includes(ext) && !video.videoWidth);
      if (video.videoWidth) stage.classList.remove('noVideo');
      video.playbackRate = +$('rate').value; say('');
    }
    $('rate').disabled = mode === 'midi';
    video.volume = +$('vol').value; Tone.Destination.volume.value = Tone.gainToDb(+$('vol').value || 0.0001);
    if (!it.file) {
      const subs = it.sub ? [it.sub] : ['vtt', 'srt'].map(e => it.src.replace(/\.[^./]+$/, '.' + e));
      for (const s of subs) if (await loadSubUrl(s, token)) break;
    }
    if (autoplay) play();
  } catch (e) { if (token === loadToken) say('错误：' + e.message); }
}
function step(d) {
  if (!items.length) return;
  let n = idx + d;
  if (n >= items.length || n < 0) { if (!loopList && d > 0) return pause(); n = (n + items.length) % items.length; }
  loadItem(n, true);
}
function drawList() {
  const ul = $('list'); ul.innerHTML = '';
  items.forEach((it, i) => {
    const li = document.createElement('li'); if (i === idx) li.className = 'cur';
    const ext = extOf(it.name || it.src);
    li.innerHTML = '<span></span><span class="tag"></span>';
    li.firstChild.textContent = (i + 1) + '. ' + nameOf(it);
    li.lastChild.textContent = MID.includes(ext) ? 'MIDI' : VID.includes(ext) ? '视频' : '音频';
    li.onclick = () => loadItem(i, true); ul.appendChild(li);
  });
}

// ---------- 事件 ----------
$('play').onclick = () => isPlaying() ? pause() : play();
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('seek').oninput = e => seek(getDur() * e.target.value / 1000);
$('vol').oninput = e => { video.volume = +e.target.value; Tone.Destination.volume.value = Tone.gainToDb(+e.target.value || 0.0001); };
$('rate').onchange = e => video.playbackRate = +e.target.value;
$('loop').onclick = e => { loopList = !loopList; e.target.classList.toggle('on', loopList); };
$('subBtn').onclick = e => { subOn = !subOn; e.target.classList.toggle('on', subOn); renderSub(); };
const THEMES = ['auto', 'light', 'dark'], THEME_ZH = {auto: '自动', light: '亮色', dark: '暗色'};
function setTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $('theme').dataset.t = t; $('theme').title = '主题：' + THEME_ZH[t] + '（点击切换）';
  try { localStorage.setItem('player-theme', t); } catch {}
}
$('theme').onclick = () => setTheme(THEMES[(THEMES.indexOf($('theme').dataset.t) + 1) % 3]);
let savedTheme = 'auto'; try { savedTheme = localStorage.getItem('player-theme') || 'auto'; } catch {}
setTheme(THEMES.includes(savedTheme) ? savedTheme : 'auto');
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
video.onended = () => step(1);
video.onclick = () => $('play').click();
$('fileMedia').onchange = e => {
  const first = items.length;
  [...e.target.files].forEach(f => items.push({src: URL.createObjectURL(f), name: f.name, title: f.name, file: f}));
  e.target.value = ''; drawList(); if (items.length > first) loadItem(first, true);
};
$('fileSub').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const c = parseSub(await f.text()); e.target.value = '';
  if (c.length) { cues = c; say('字幕：' + f.name + '（' + c.length + ' 条）'); } else say('字幕解析失败（仅支持 SRT / VTT）');
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight') seek(Math.min(getDur(), getTime() + 5));
  if (e.code === 'ArrowLeft') seek(Math.max(0, getTime() - 5));
});

// ---------- 刷新循环 ----------
(function loop() {
  const t = getTime(), d = getDur();
  $('time').textContent = fmt(t) + ' / ' + fmt(d);
  if (document.activeElement !== $('seek')) $('seek').value = d ? t / d * 1000 : 0;
  $('play').textContent = isPlaying() ? '⏸' : '▶';
  if (mode === 'midi' && midi.playing && t >= midi.dur) { midi.pause(); midi.from = midi.dur; step(1); }
  renderSub();
  requestAnimationFrame(loop);
})();

drawList();
if (items.length) loadItem(0, false);
</script>
</body>
</html>
