<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f5fa">
<title>媒体播放器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 图标（Material 图标路径） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
  <symbol id="i-movie" viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></symbol>
  <symbol id="i-piano" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 19H5V5h4v14zm5 0h-3v-6h3v6zm0-8h-3V5h3v6zm5 8h-4V5h4v14z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
  <symbol id="i-once" viewBox="0 0 24 24"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></symbol>
  <symbol id="i-sub" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 12h4v2H4v-2zm10 6H4v-2h10v2zm6 0h-4v-2h4v2zm0-4H10v-2h10v2z"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
  <symbol id="i-fsx" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></symbol>
</svg>

<header class="appbar">
  <div class="brand">
    <span class="logo"><svg class="i"><use href="#i-note"/></svg></span>
    <h1>媒体播放器</h1>
  </div>
  <div class="appbar-actions">
    <button class="btn tonal" id="btnAdd" type="button" title="添加音频 / 视频 / MIDI（可同时选字幕）">
      <svg class="i"><use href="#i-add"/></svg><span class="lbl">添加文件</span>
    </button>
    <button class="btn" id="btnSub" type="button" title="为当前曲目加载字幕 / 歌词（SRT · VTT · LRC）">
      <svg class="i"><use href="#i-sub"/></svg><span class="lbl">加载字幕</span>
    </button>
    <input id="fileMedia" type="file" multiple hidden
      accept="audio/*,video/*,.mid,.midi,.kar,.mkv,.flac,.opus,.m4a,.aac,.wma,.srt,.vtt,.lrc,.txt">
    <input id="fileSub" type="file" hidden accept=".srt,.vtt,.lrc,.txt">
  </div>
</header>

<main class="layout">
  <section class="player card" id="player" aria-label="播放器">
    <div class="stage" id="stage" data-mode="empty">
      <video id="media" playsinline preload="metadata"></video>
      <canvas id="roll"></canvas>
      <div class="art" id="art">
        <div class="art-tile"><svg class="i"><use href="#i-note"/></svg></div>
        <div class="art-title" id="artTitle">还没有曲目</div>
        <div class="art-hint" id="artHint">把文件放进文件夹，在 player.js 顶部列表里加上文件名；<br>或把文件拖到这里。</div>
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="caption" id="caption" hidden></div>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <div class="meta">
      <div class="title" id="title">未加载</div>
      <div class="subtitle" id="subtitle"></div>
    </div>

    <div class="seek">
      <span id="tCur" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      <span id="tDur" class="time">0:00</span>
    </div>

    <div class="controls">
      <div class="ctl-side left">
        <button class="ib" id="btnMode" type="button" title="列表循环"><svg class="i"><use href="#i-repeat"/></svg></button>
        <button class="chip" id="btnRate" type="button" title="播放速度">1×</button>
      </div>
      <div class="ctl-main">
        <button class="ib lg" id="btnPrev" type="button" title="上一首 (P)"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="fab" id="btnPlay" type="button" title="播放 / 暂停 (空格)"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="ib lg" id="btnNext" type="button" title="下一首 (N)"><svg class="i"><use href="#i-next"/></svg></button>
      </div>
      <div class="ctl-side right">
        <div class="vol">
          <button class="ib" id="btnMute" type="button" title="静音 (M)"><svg class="i"><use href="#i-vol"/></svg></button>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
        </div>
        <button class="ib" id="btnCC" type="button" title="显示 / 隐藏字幕 (C)"><svg class="i"><use href="#i-cc"/></svg></button>
        <button class="ib" id="btnFS" type="button" title="全屏 (F)"><svg class="i"><use href="#i-fs"/></svg></button>
      </div>
    </div>
  </section>

  <aside class="side card" aria-label="播放列表与歌词">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabList" aria-selected="true" type="button">播放列表<span class="badge" id="nList">0</span></button>
      <button class="tab" role="tab" id="tabLyr" aria-selected="false" type="button">歌词 / 字幕<span class="badge" id="nLyr">0</span></button>
    </div>
    <ul class="list" id="list" role="listbox" aria-label="播放列表"></ul>
    <div class="lyrics" id="lyrics" hidden></div>
  </aside>
</main>

<div class="drop" id="drop" aria-hidden="true">
  <div class="drop-box"><svg class="i"><use href="#i-upload"/></svg><b>松开即可添加</b><span>音频 · 视频 · MIDI · 字幕 / 歌词</span></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="player.js"></script>
</body>
</html>
