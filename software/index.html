<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPTHelper 下载</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --text: #e5e7eb;
        --muted: #cbd5e1;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
      }

      .card {
        width: min(90vw, 480px);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      .download-btn {
        display: inline-block;
        padding: 14px 28px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 700;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .download-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PPTHelper</h1>
      <p>点击下面的按钮下载 PPTHelper.exe。</p>
      <a class="download-btn" href="./PPTHelper.exe" download="PPTHelper.exe">下载 PPTHelper.exe</a>
    </div>
  </body>
</html>
