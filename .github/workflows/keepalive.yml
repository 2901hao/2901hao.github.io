# 每天北京时间 23:50 访问一次后端的 /api/ping，防止 Supabase 免费项目因为长期没人访问被暂停。
# 不需要先判断"当天有没有人访问过"：多发一次请求没有任何副作用，效果和"没有就补一个"一样。
name: keepalive
on:
  schedule:
    - cron: '50 15 * * *'     # UTC 15:50 = 北京时间 23:50（GitHub 的定时任务偶尔会晚几分钟到十几分钟）
  workflow_dispatch: {}       # 也可以在 Actions 页面手动点 Run workflow 试一下
permissions:
  contents: write      # 每周提交一次时间戳，防止仓库 60 天没动静被 GitHub 停掉定时任务
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping every backend address in shared/api-config.json
        run: |
          ok=0; total=0
          for base in $(jq -r '.bases[]' shared/api-config.json); do
            total=$((total+1))
            if curl -fsS --max-time 30 --retry 4 --retry-delay 10 --retry-all-errors "$base/api/ping" -o /tmp/out.txt; then
              echo "OK   $base"; head -c 300 /tmp/out.txt; echo; ok=$((ok+1))
            else
              echo "::warning::FAILED $base"
            fi
          done
          # Supabase 的数据接口（可选）：在仓库 Settings → Secrets 里加 SUPABASE_URL 和 SUPABASE_ANON_KEY，就会多访问一次它，算数据库活动
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            curl -sS --max-time 30 -o /dev/null -w "supabase rest: %{http_code}\n" "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY" || echo "::warning::supabase rest failed"
          fi
          echo "$ok / $total addresses reachable"
          [ "$ok" -ge 1 ]       # 一个都不通才算失败（失败时 GitHub 会给你发邮件）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Weekly commit so GitHub never disables this schedule
        if: always()
        run: |
          # 每周日提交一次时间戳（GitHub 对 60 天没有提交的仓库会停掉定时任务）
          if [ "$(date -u +%u)" = "7" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-last.txt
            git config user.name "keepalive-bot"; git config user.email "keepalive-bot@users.noreply.github.com"
            git add .github/keepalive-last.txt
            git commit -m "chore: keepalive $(cat .github/keepalive-last.txt)" || true
            git push || echo "::warning::push failed (branch protection?)"
          fi
