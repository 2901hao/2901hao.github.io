<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="f.doc">2901班 论坛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="../shared/i18n.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/skin.js"></script>
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="../shared/skins.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 8px 18px 40px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 14px; }
  .head h1 { margin: 0; font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-weight: 400; font-size: clamp(30px, 8vw, 40px); }
  .head h1 small { font-family: "Noto Sans SC", sans-serif; font-size: 13px; font-weight: 500; color: var(--color-ink-soft); margin-left: 8px; }

  .gate, .empty, .errbox { text-align: center; padding: 36px 22px; }
  .gate .em, .empty .em, .errbox .em { font-size: 34px; display: block; margin-bottom: 8px; }
  .gate p, .empty p, .errbox p { margin: 6px 0 16px; font-size: 14px; line-height: 1.7; color: var(--color-ink-soft); }
  .errbox p.code { font-size: 12px; opacity: .8; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: block; padding: 14px 16px; text-decoration: none; color: inherit; transition: transform .12s; }
  .item:hover { transform: translateY(-2px); }
  .item:focus-visible { outline: 2px solid var(--color-sky); outline-offset: 2px; }
  .item h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
  .item .snip { margin: 0 0 8px; font-size: 13.5px; color: var(--color-ink-soft); line-height: 1.55; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--color-ink-soft); }
  .meta .who { font-weight: 700; color: var(--color-ink); }
  .meta .cnt { margin-left: auto; color: var(--color-sky); font-weight: 700; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--color-sun) 35%, transparent); color: var(--color-ink); vertical-align: 2px; margin-left: 6px; }
  .more { display: block; margin: 16px auto 0; }

  .field {
    width: 100%; padding: 12px 14px; border-radius: 12px; font: 16px/1.6 "Noto Sans SC", sans-serif;
    border: 1px solid var(--color-line); background: var(--field-bg); color: var(--color-ink);
  }
  .field:focus { outline: 2px solid var(--color-sky); outline-offset: 1px; }
  textarea.field { resize: vertical; min-height: 120px; }
  .compose { padding: 16px; margin-bottom: 14px; display: none; }
  .compose.open { display: block; }
  .compose .field + .field { margin-top: 10px; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .actions .count { font-size: 12px; color: var(--color-ink-soft); margin-right: auto; }
  .actions .count.over { color: var(--danger); }
  .formmsg { font-size: 13px; color: var(--danger); min-height: 18px; margin-top: 8px; }

  .post { padding: 18px 18px 14px; }
  .post h2 { margin: 0 0 8px; font-size: 21px; line-height: 1.4; overflow-wrap: anywhere; }
  .content { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.75; margin: 12px 0 4px; }
  .linkbtn { background: none; border: 0; padding: 0; font: 500 12.5px "Noto Sans SC", sans-serif; color: var(--color-ink-soft); cursor: pointer; text-decoration: underline; }
  .linkbtn:hover { color: var(--danger); }
  .rhead { margin: 22px 4px 10px; font-size: 14px; font-weight: 700; color: var(--color-ink-soft); }
  .reply { padding: 12px 16px; }
  .reply .content { margin: 6px 0 2px; font-size: 14.5px; }
  .reply .meta .floor { font-weight: 700; color: var(--color-sky); }
  .reply-box { padding: 14px; margin-top: 14px; }
  .reply-box textarea.field { min-height: 80px; }

  /* 标签页：帖子 / 问卷 */
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .tabs a.pill.on { background: var(--color-sky); border-color: var(--color-sky); color: #fff; }
  /* 点赞 */
  .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .likebtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; cursor: pointer; font: 600 14px/1 var(--font, "Noto Sans SC", sans-serif); color: var(--color-ink); background: var(--color-card); border: 1px solid var(--color-line); transition: transform .1s; }
  .likebtn:hover { transform: translateY(-1px); }
  .likebtn.on { color: var(--color-track); border-color: var(--color-track); }
  .likebtn:focus-visible { outline: 2px solid var(--color-sky); outline-offset: 2px; }
  .meta .lk { color: var(--color-track); font-weight: 700; }
  /* 投票 */
  .poll { margin-top: 16px; padding: 14px; border: 1px solid var(--color-line); border-radius: 14px; background: color-mix(in srgb, var(--color-card) 55%, transparent); }
  .poll .ph { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--color-ink-soft); }
  .poll .ph strong { color: var(--color-ink); font-size: 14px; }
  .opt { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--color-line); border-radius: 10px; overflow: hidden; background: var(--color-card); font-size: 14.5px; overflow-wrap: anywhere; }
  label.opt { cursor: pointer; }
  label.opt:hover { border-color: var(--color-sky); }
  .opt input { accent-color: var(--color-sky); flex: none; width: 17px; height: 17px; margin: 0; }
  .opt i { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: color-mix(in srgb, var(--color-sky) 24%, transparent); transition: width .3s; }
  .opt > span { position: relative; }
  .opt .n { margin-left: auto; font-size: 12.5px; color: var(--color-ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .opt.mine { border-color: var(--color-sky); }
  .opt .nm { position: relative; flex-basis: 100%; font-size: 12.5px; line-height: 1.5; color: var(--color-ink-soft); }
  .setbox { margin-top: 10px; display: grid; gap: 8px; font-size: 13.5px; }
  .setbox .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .setbox .line > span:first-child { flex: none; color: var(--color-ink-soft); }
  .setbox select.field { max-width: 100%; flex: 1; min-width: 0; }
  .poll .hint, .sv-note { margin: 10px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--color-ink-soft); }
  .poll .actions { margin-top: 10px; }
  /* 发帖表单里的投票设置 */
  .pollform { margin-top: 10px; padding: 12px; border: 1px dashed var(--color-line); border-radius: 12px; display: none; }
  .pollform.open { display: block; }
  .row2 { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row2 .field { flex: 1; min-width: 0; padding: 9px 12px; font-size: 15px; }
  .xbtn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--color-line); background: var(--color-card); color: var(--color-ink-soft); cursor: pointer; font-size: 14px; line-height: 1; }
  .xbtn:hover { color: var(--danger); border-color: var(--danger); }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; }
  .chk input { accent-color: var(--color-sky); width: 16px; height: 16px; margin: 0; }
  select.field { width: auto; padding: 8px 10px; font-size: 14px; }
  .opts-line { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; font-size: 13.5px; }
  /* 问卷 */
  .sv-q { padding: 16px; margin-bottom: 12px; }
  .sv-q h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
  .sv-q h3 .no { color: var(--color-sky); margin-right: 6px; }
  .sv-q h3 .req { color: var(--danger); margin-left: 4px; }
  .sv-q .kind { font-size: 12px; color: var(--color-ink-soft); margin-bottom: 4px; }
  .sv-q textarea.field { min-height: 90px; margin-top: 8px; }
  .sv-edit { padding: 14px; margin-bottom: 12px; }
  .sv-edit .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sv-edit .top b { margin-right: auto; }
  .texts { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .texts li { padding: 9px 12px; border: 1px solid var(--color-line); border-radius: 10px; background: var(--color-card); font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .svtools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .tag.open { background: color-mix(in srgb, var(--color-grass) 30%, transparent); }
  .sv-desc { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.7; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="topbar">
  <a class="pill" href="../" data-i18n="back.home">← 返回首页</a>
  <div class="tools"><span id="langbtn"></span><span id="skinbtn"></span><span id="themebtn"></span><div id="authbar"></div></div>
</header>

<main id="app"></main>

<footer class="site-foot" data-i18n="f.foot">2901 班 · 论坛 · 请文明发言，互相尊重</footer>

<script src="../shared/auth.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var LIM = { TITLE: 60, POST: 2000, REPLY: 300, POLL_OPTS: 10, POLL_OPT_LEN: 40,
              SV_TITLE: 60, SV_DESC: 300, SV_Q: 20, SV_Q_LEN: 100, SV_OPTS: 12, SV_OPT_LEN: 60, SV_TEXT: 200 };   // 与后端 forum.js 保持一致
  var token = 0;                                       // 防止异步结果渲染到已离开的页面

  var t = function (k, p) { return I18n.t(k, p); };
  I18n.mount(document.getElementById('langbtn'));
  Skin.mount(document.getElementById('skinbtn'));
  Theme.mount(document.getElementById('themebtn'));
  Auth.mountBar(document.getElementById('authbar'));
  Auth.onChange(route);
  I18n.onChange(route);   // 切换语言后整页重画
  window.addEventListener('hashchange', route);

  /* ---------- 小工具 ---------- */
  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'class') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function ago(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return t('f.ago.now');
    if (s < 3600) return t('f.ago.min', { n: Math.floor(s / 60) });
    if (s < 86400) return t('f.ago.hour', { n: Math.floor(s / 3600) });
    if (s < 86400 * 30) return t('f.ago.day', { n: Math.floor(s / 86400) });
    var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function who(name, av, size) {
    return h('span', { class: 'who', style: 'display:inline-flex;align-items:center;gap:6px' }, [Auth.avatar(name, av, size || 22), name]);
  }
  function fmtTime(ts) { var d = new Date(ts), z = function (n) { return n < 10 ? '0' + n : n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
  /* 后端带 code 的错误按当前语言显示，其余用后端原文 */
  function errMsg(res, fallback) {
    var b = (res && res.body) || {};
    if (b.code) { var k = 'err.' + b.code, s = t(k); if (s && s !== k) return s; }
    return b.error || fallback;
  }
  function len(s) { return Array.from(s).length; }
  function show(nodes) { app.textContent = ''; nodes.forEach(function (n) { app.appendChild(n); }); window.scrollTo(0, 0); }

  function errorBox(res, retry) {
    var notDeployed = res && (res.status === 404 || res.status === 503);
    var msg = res && res.body && res.body.error;
    return h('div', { class: 'glass errbox' }, [
      h('span', { class: 'em', text: notDeployed ? '🛠️' : '📡' }),
      h('strong', { text: notDeployed ? t('f.err.nodep') : t('f.err.conn') }),
      h('p', { text: notDeployed ? t('f.err.nodep.msg') : (msg || t('f.err.conn.msg')) }),
      h('button', { class: 'btn primary', type: 'button', text: t('f.retry'), onclick: retry })
    ]);
  }

  /* 论坛接口：401 时 Auth.api 会清掉登录状态并触发 route() 回到登录页 */
  function call(name, payload) {
    return Auth.api('/api/forum/' + name, payload).catch(function () { return { status: 0, body: {} }; });
  }

  /* ---------- 路由 ---------- */
  function route() {
    token++;
    if (!Auth.isLoggedIn()) return renderGate();
    if (location.hash === '#/admin' && Auth.isAdmin()) return renderAdmin();
    if (location.hash === '#/surveys') return renderSurveys();
    if (location.hash === '#/s/new') return renderSurveyNew();
    var ms = /^#\/s\/(\d+)(\/results)?/.exec(location.hash);
    if (ms) return ms[2] ? renderSurveyResults(+ms[1]) : renderSurvey(+ms[1]);
    var m = /^#\/p\/(\d+)/.exec(location.hash);
    if (m) renderPost(+m[1]); else renderList();
  }

  function renderGate() {
    show([
      h('div', { class: 'head' }, [h('h1', { text: t('f.title') })]),
      h('div', { class: 'glass gate' }, [
        h('span', { class: 'em', text: '🔐' }),
        h('strong', { text: t('f.gate.title') }),
        h('p', { text: t('f.gate.msg', { game: t('g.title') }) }),
        h('button', { class: 'btn primary', type: 'button', text: t('auth.loginReg'), onclick: function () { Auth.openLogin(); } })
      ])
    ]);
  }

  /* ---------- 帖子列表 ---------- */
  function renderList() {
    var my = token;
    var listEl = h('div', { class: 'list' });
    var moreBtn = h('button', { class: 'btn more', type: 'button', text: t('f.more'), style: 'display:none' });
    var cursor = null;
    var loading = false;

    var compose = buildCompose(function (id) { location.hash = '#/p/' + id; });
    var newBtn = h('button', { class: 'btn primary', type: 'button', text: t('f.new'), onclick: function () {
      compose.el.classList.toggle('open');
      if (compose.el.classList.contains('open')) compose.focus();
    } });

    var right = h('div', { style: 'display:flex;gap:8px' }, [
      Auth.isAdmin() ? h('a', { class: 'pill', href: '#/admin', text: t('f.admin') }) : null, newBtn
    ]);
    show([
      h('div', { class: 'head' }, [h('h1', { text: t('f.title') }), right]),
      tabs('posts'), compose.el, listEl, moreBtn
    ]);

    function load(first) {
      if (loading) return; loading = true;
      moreBtn.disabled = true;
      if (first) listEl.appendChild(h('div', { class: 'empty', text: t('f.loading') }));
      var payload = cursor ? { last_at: cursor.last_at, last_id: cursor.id } : {};
      call('list', payload).then(function (res) {
        if (my !== token) return;
        loading = false; moreBtn.disabled = false;
        if (first) listEl.textContent = '';
        if (!res.body || !res.body.ok) {
          if (res.status === 401) return;
          if (first) { listEl.appendChild(errorBox(res, function () { route(); })); } else Auth.toast(t('f.loadFail'));
          return;
        }
        var posts = res.body.posts || [];
        if (first && !posts.length) {
          listEl.appendChild(h('div', { class: 'glass empty' }, [
            h('span', { class: 'em', text: '📭' }), h('strong', { text: t('f.empty.title') }), h('p', { text: t('f.empty.msg') })
          ]));
        }
        posts.forEach(function (p) { listEl.appendChild(postItem(p, res.body.me)); });
        if (posts.length) cursor = posts[posts.length - 1];
        moreBtn.style.display = res.body.hasMore ? '' : 'none';
      });
    }
    moreBtn.onclick = function () { load(false); };
    load(true);
  }

  function postItem(p, me) {
    var title = h('h3', { text: p.title });
    if (p.author === me) title.appendChild(h('span', { class: 'tag', text: t('f.mine') }));
    if (p.has_poll) title.appendChild(h('span', { class: 'tag', text: '📊 ' + t('v.tag') }));
    return h('a', { class: 'glass item', href: '#/p/' + p.id }, [
      title,
      h('p', { class: 'snip', text: p.snippet }),
      h('div', { class: 'meta' }, [
        who(p.author, p.av),
        h('span', { text: t('f.posted', { t: ago(p.created_at) }) }),
        h('span', { class: 'cnt', text: (p.like_count ? '♥ ' + p.like_count + '　' : '') + '💬 ' + p.reply_count })
      ])
    ]);
  }

  /* ---------- 发帖表单（可附带投票） ---------- */
  /* 发起人自选：匿名 / 实名、谁能看结果（问卷还可选填空内容是否公开） */
  function settingsBox(withTexts) {
    var who = h('select', { class: 'field' }, [h('option', { value: 'anon', text: t('set.anon') }), h('option', { value: 'named', text: t('set.named') })]);
    var vis = h('select', { class: 'field' }, [h('option', { value: 'after', text: t('set.vis.after') }), h('option', { value: 'public', text: t('set.vis.public') }), h('option', { value: 'owner', text: t('set.vis.owner') })]);
    var tx = h('input', { type: 'checkbox' });
    var kids = [h('div', { class: 'line' }, [h('span', { text: t('set.identity') }), who]), h('div', { class: 'line' }, [h('span', { text: t('set.vis') }), vis])];
    if (withTexts) kids.push(h('label', { class: 'chk' }, [tx, t('set.texts')]));
    return { el: h('div', { class: 'setbox' }, kids), get: function () { return { anon: who.value === 'anon', vis: vis.value, texts_public: tx.checked }; } };
  }
  function settingsLine(anon, vis, texts) {
    var parts = [t(anon ? 'set.s.anon' : 'set.s.named'), t('set.s.' + vis)];
    if (texts !== undefined) parts.push(t(texts ? 'set.s.textsPub' : 'set.s.textsPriv'));
    return parts.join(' · ');
  }
  function deadlineSelect() {
    var sel = h('select', { class: 'field' });
    [['0', 'v.dl.none'], ['1', 'v.dl.1h'], ['24', 'v.dl.1d'], ['72', 'v.dl.3d'], ['168', 'v.dl.7d'], ['720', 'v.dl.30d']].forEach(function (o) {
      sel.appendChild(h('option', { value: o[0], text: t(o[1]) }));
    });
    return sel;
  }
  function buildCompose(onCreated) {
    var title = h('input', { class: 'field', type: 'text', placeholder: t('f.ph.title', { n: LIM.TITLE }), maxlength: String(LIM.TITLE * 2) });
    var body = h('textarea', { class: 'field', placeholder: t('f.ph.body', { n: LIM.POST }) });
    var count = h('span', { class: 'count', text: '0 / ' + LIM.POST });
    var msg = h('div', { class: 'formmsg' });
    var cancel = h('button', { class: 'btn', type: 'button', text: t('f.fold') });
    var send = h('button', { class: 'btn primary', type: 'button', text: t('f.publish') });

    // 投票设置
    var pollOn = false;
    var optBox = h('div');
    var multi = h('input', { type: 'checkbox' });
    var dl = deadlineSelect();
    var setp = settingsBox(false);
    var addOpt = h('button', { class: 'btn', type: 'button', text: t('v.addOpt') });
    var pollEl = h('div', { class: 'pollform' }, [
      optBox,
      h('div', { class: 'row2' }, [addOpt]),
      h('div', { class: 'opts-line' }, [
        h('label', { class: 'chk' }, [multi, t('v.multiAllow')]),
        h('span', {}, [t('v.deadline') + '　', dl])
      ]),
      setp.el,
      h('p', { class: 'hint', style: 'margin:8px 0 0;font-size:12.5px;color:var(--color-ink-soft)', text: t('v.hint2') })
    ]);
    var pollBtn = h('button', { class: 'btn', type: 'button', text: t('v.add') });
    function optInputs() { return Array.prototype.slice.call(optBox.querySelectorAll('input.field')); }
    function addOption() {
      var n = optInputs().length;
      if (n >= LIM.POLL_OPTS) return;
      var inp = h('input', { class: 'field', type: 'text', placeholder: t('v.optPh', { n: n + 1 }), maxlength: String(LIM.POLL_OPT_LEN * 2) });
      var row = h('div', { class: 'row2' }, [inp, h('button', { class: 'xbtn', type: 'button', title: t('v.delOpt'), 'aria-label': t('v.delOpt'), text: '✕', onclick: function () {
        if (optInputs().length <= 2) return;
        row.remove(); renumber();
      } })]);
      optBox.appendChild(row); renumber();
    }
    function renumber() {
      optInputs().forEach(function (i, k) { i.placeholder = t('v.optPh', { n: k + 1 }); });
      addOpt.style.display = optInputs().length >= LIM.POLL_OPTS ? 'none' : '';
    }
    function setPoll(on) {
      pollOn = on; pollEl.classList.toggle('open', on);
      pollBtn.textContent = on ? t('v.remove') : t('v.add');
      if (on && !optInputs().length) { addOption(); addOption(); }
    }
    addOpt.onclick = addOption;
    pollBtn.onclick = function () { setPoll(!pollOn); };

    var el = h('div', { class: 'glass compose' }, [title, body, pollEl, h('div', { class: 'actions' }, [count, pollBtn, cancel, send]), msg]);

    body.addEventListener('input', function () {
      var n = len(body.value); count.textContent = n + ' / ' + LIM.POST; count.className = 'count' + (n > LIM.POST ? ' over' : '');
    });
    cancel.onclick = function () { el.classList.remove('open'); };
    send.onclick = function () {
      var ti = title.value.trim(), b = body.value.trim();
      if (!ti || !b) { msg.textContent = t('f.e.empty'); return; }
      if (len(ti) > LIM.TITLE) { msg.textContent = t('f.e.title', { n: LIM.TITLE }); return; }
      if (len(b) > LIM.POST) { msg.textContent = t('f.e.body', { n: LIM.POST }); return; }
      var payload = { title: ti, body: b };
      if (pollOn) {
        var seen = {}, opts = [];
        optInputs().forEach(function (i) { var v = i.value.trim(); if (v && !seen[v]) { seen[v] = 1; opts.push(v); } });
        if (opts.length < 2) { msg.textContent = t('v.e.opts'); return; }
        var sg = setp.get();
        payload.poll = { options: opts, multi: multi.checked, hours: Number(dl.value) || 0, anon: sg.anon, vis: sg.vis };
      }
      send.disabled = true; msg.textContent = '';
      call('create', payload).then(function (res) {
        send.disabled = false;
        if (res.body && res.body.ok) { title.value = ''; body.value = ''; setPoll(false); optBox.textContent = ''; onCreated(res.body.id); }
        else if (res.status !== 401) msg.textContent = errMsg(res, t('f.e.pubfail'));
      });
    };
    return { el: el, focus: function () { title.focus(); } };
  }

  /* ---------- 帖子里的投票卡片 ---------- */
  function buildPoll(postId, poll) {
    var box = h('div', { class: 'poll' });
    draw(poll);
    function draw(pl) {
      box.textContent = '';
      var voted = pl.mine && pl.mine.length > 0;
      var canVote = !voted && !pl.closed;
      var seeRes = !!pl.can_see && pl.counts;
      box.appendChild(h('div', { class: 'ph' }, [
        h('strong', { text: '📊 ' + t('v.tag') }),
        h('span', { text: pl.multi ? t('v.multi') : t('v.single') }),
        h('span', { text: t('v.voters', { n: pl.voters || 0 }) }),
        pl.closed ? h('span', { class: 'tag', text: t('v.closed') }) : (pl.closes_at ? h('span', { text: t('v.closesAt', { t: fmtTime(pl.closes_at) }) }) : null)
      ]));
      box.appendChild(h('div', { class: 'ph', style: 'margin-top:2px', text: settingsLine(pl.anon, pl.vis) }));
      var voters = pl.voters || 0;
      var inputs = [];
      var go;
      pl.options.forEach(function (o, i) {
        var isMine = voted && pl.mine.indexOf(i) >= 0;
        var kids = [];
        if (seeRes) kids.push(h('i', { style: '--w:' + (voters ? Math.round((pl.counts[i] || 0) * 100 / voters) : 0) + '%' }));
        if (canVote) {
          var inp = h('input', { type: pl.multi ? 'checkbox' : 'radio', name: 'pv' + postId });
          inp.addEventListener('change', function () { go.disabled = !inputs.some(function (x) { return x.checked; }); });
          inputs.push(inp); kids.push(inp);
        }
        kids.push(h('span', { text: (isMine ? '✓ ' : '') + o }));
        if (seeRes) kids.push(h('span', { class: 'n', text: t('v.votes', { n: pl.counts[i] || 0 }) + ' · ' + (voters ? Math.round((pl.counts[i] || 0) * 100 / voters) : 0) + '%' }));
        if (seeRes && pl.names && pl.names[i] && pl.names[i].length) kids.push(h('span', { class: 'nm', text: t('v.names', { n: pl.names[i].join('、') }) }));
        box.appendChild(h(canVote ? 'label' : 'div', { class: 'opt' + (isMine ? ' mine' : '') }, kids));
      });
      if (!seeRes && !pl.can_see) box.appendChild(h('p', { class: 'hint', text: pl.vis === 'owner' ? t('v.res.owner') : t('v.res.after') }));
      if (canVote) {
        go = h('button', { class: 'btn primary', type: 'button', text: t('v.vote'), disabled: 'disabled' });
        go.onclick = function () {
          var picks = []; inputs.forEach(function (x, k) { if (x.checked) picks.push(k); });
          go.disabled = true;
          call('poll_vote', { post_id: postId, options: picks }).then(function (r) {
            if (r.body && r.body.ok) draw(r.body.poll);
            else { go.disabled = false; if (r.status !== 401) Auth.toast(errMsg(r, t('f.loadFail'))); }
          });
        };
        box.appendChild(h('div', { class: 'actions' }, [go]));
        box.appendChild(h('p', { class: 'hint', text: t('v.hint2') }));
      }
    }
    return box;
  }

  /* ---------- 帖子详情 ---------- */
  function renderPost(id) {

      /* 点赞 + 投票 */
      var likeBtn = h('button', { class: 'likebtn' + (p.liked ? ' on' : ''), type: 'button' });
      function paintLike() {
        likeBtn.className = 'likebtn' + (p.liked ? ' on' : '');

      var art = nodes[nodes.length - 1];

      nodes.push(h('div', { class: 'rhead', text: t('f.replies', { n: d.replies.length }) }));

                if (x.body && x.body.ok) route(); else if (x.status !== 401) Auth.toast((x.body && x.body.error) || t('f.del.fail'));
              });
            });
          } }));
        }
        nodes.push(h('div', { class: 'glass reply', style: 'margin-bottom:10px' }, [rm, h('div', { class: 'content', text: r.body })]));
      });

      var ta = h('textarea', { class: 'field', placeholder: t('f.ph.reply', { n: LIM.REPLY }) });

      var send = h('button', { class: 'btn primary', type: 'button', text: t('f.reply') });
      ta.addEventListener('input', function () { var n = len(ta.value); count.textContent = n + ' / ' + LIM.REPLY; count.className = 'count' + (n > LIM.REPLY ? ' over' : ''); });
      send.onclick = function () {
        var b = ta.value.trim();
        if (!b) { msg.textContent = t('f.e.replyEmpty'); return; }
        if (len(b) > LIM.REPLY) { msg.textContent = t('f.e.replyLen', { n: LIM.REPLY }); return; }
        send.disabled = true; msg.textContent = '';
        call('reply', { post_id: p.id, body: b }).then(function (res) {
          send.disabled = false;
          if (res.body && res.body.ok) route();
          else if (res.status !== 401) msg.textContent = errMsg(res, t('f.e.replyFail'));
        });
      };
      nodes.push(h('div', { class: 'glass reply-box' }, [ta, h('div', { class: 'actions' }, [count, send]), msg]));
      show(nodes);

  }

  function renderSurveyNew() {
    var title = h('input', { class: 'field', type: 'text', placeholder: t('sv.f.title', { n: LIM.SV_TITLE }), maxlength: String(LIM.SV_TITLE * 2) });

      if (d.done) nodes.push(h('div', { class: 'rhead', text: '✓ ' + t('sv.done') + ' · ' + t('sv.yourAns') }));

      var getters = [];
      sv.questions.forEach(function (q, i) {

        } else {
          var picked = [];

          if (canFill) {
            getters.push(function () {
              var sel = []; picked.forEach(function (x, k) { if (x.checked) sel.push(k); });
              if (q.t === 'multi') return sel;
              return sel.length ? sel[0] : null;
            });
          }
        }
        nodes.push(card);
      });

      if (canFill) {
        var msg = h('div', { class: 'formmsg' });
        var send = h('button', { class: 'btn primary', type: 'button', text: t('sv.submit') });
        send.onclick = function () {
          var ans = getters.map(function (g) { return g(); });
          for (var i = 0; i < sv.questions.length; i++) {
            var q = sv.questions[i], a = ans[i];
            if (q.req && (a === null || (Array.isArray(a) && !a.length))) { msg.textContent = t('sv.e.required', { n: i + 1 }); return; }
          }
          send.disabled = true; msg.textContent = '';
          call('survey_submit', { id: sv.id, answers: ans }).then(function (r) {
            send.disabled = false;
            if (r.body && r.body.ok) { Auth.toast(t('sv.thanks')); route(); }
            else if (r.status !== 401) msg.textContent = errMsg(r, t('f.e.pubfail'));
          });
        };
        nodes.push(h('div', { class: 'actions', style: 'justify-content:flex-end' }, [send]), msg);
      }
      show(nodes);
    }
  }

  function renderSurveyResults(id) {
    var my = token;
    var back = h('div', { class: 'head' }, [h('a', { class: 'pill', href: '#/s/' + id, text: '←' })]);
    show([back, h('div', { class: 'glass empty', text: t('f.loading') })]);
    Promise.all([call('survey_get', { id: id }), call('survey_results', { id: id })]).then(function (rs) {
      if (my !== token) return;
      var g = rs[0], r = rs[1];
      if (!g.body || !g.body.ok) { if (g.status === 401) return; show([backSv(), g.status === 404 ? goneBox() : errorBox(g, function () { route(); })]); return; }
      if (!r.body || !r.body.ok) { if (r.status === 401) return; show([h('div', { class: 'head' }, [h('a', { class: 'pill', href: '#/s/' + id, text: '←' })]), h('div', { class: 'glass empty' }, [h('strong', { text: errMsg(r, t('f.err.conn')) })])]); return; }
      var sv = g.body.survey, res = r.body;
      var nodes = [h('div', { class: 'head' }, [h('a', { class: 'pill', href: '#/s/' + id, text: '← ' + sv.title })]),
        h('div', { class: 'glass post' }, [h('h2', { text: t('sv.res.title'), style: 'margin:0 0 4px' }), h('div', { class: 'meta', text: t('sv.res.total', { n: res.total }) })])];
      sv.questions.forEach(function (q, i) {
        var o = res.questions[i];
        var card = h('div', { class: 'glass sv-q', style: 'margin-top:12px' }, [h('h3', {}, [h('span', { class: 'no', text: (i + 1) + '.' }), q.q]),
          h('div', { class: 'kind', text: t('sv.t.' + q.t) + ' · ' + t('sv.res.answered', { n: o.answered }) })]);
        if (q.t === 'text') {
          if (!o.texts) card.appendChild(h('p', { class: 'sv-note', text: t('sv.res.textsPrivate') }));
          else if (!o.texts.length) card.appendChild(h('p', { class: 'sv-note', text: t('sv.res.none') }));
          else {
            card.appendChild(h('p', { class: 'sv-note', text: res.anon ? t('sv.res.textsAnon') : t('sv.res.textsNamed') }));
            card.appendChild(h('ul', { class: 'texts' }, o.texts.map(function (x) { return h('li', { text: typeof x === 'string' ? x : x.u + '：' + x.v }); })));
          }
        } else {
          q.opts.forEach(function (name, k) {
            var c = o.counts[k] || 0, pct = o.answered ? Math.round(c * 100 / o.answered) : 0;
            var kids = [h('i', { style: '--w:' + pct + '%' }), h('span', { text: name }), h('span', { class: 'n', text: c + ' · ' + pct + '%' })];
            if (o.names && o.names[k] && o.names[k].length) kids.push(h('span', { class: 'nm', text: t('v.names', { n: o.names[k].join('、') }) }));
            card.appendChild(h('div', { class: 'opt' }, kids));
          });
        }
        nodes.push(card);
      });
      show(nodes);
    });
  }

  /* ---------- 管理员：强制注销账号 ---------- */
  function renderAdmin() {
    var my = token;
    var back = h('a', { class: 'pill', href: '#/', text: t('f.all') });
    var box = h('div', { class: 'list' }, [h('div', { class: 'glass empty', text: t('f.loading') })]);
    var search = h('input', { class: 'field', type: 'text', placeholder: t('f.adm.search'), style: 'margin-bottom:12px' });
    show([h('div', { class: 'head' }, [h('h1', { text: t('f.adm.title') }), back]),
      h('p', { class: 'rhead', style: 'margin-top:0', text: t('f.adm.note') }),
      h('button', { class: 'btn', type: 'button', style: 'margin-bottom:12px', text: t('f.adm.enc'), onclick: function () {
        Auth.api('/api/admin_encrypt_all', {}).then(function (res) {
          if (res.body && res.body.ok) Auth.toast(t('f.adm.encDone', { n: res.body.count }));
          else if (res.status !== 401) Auth.toast((res.body && res.body.error) || t('auth.fail'));
        }).catch(function () { Auth.toast(t('auth.offline')); });
      } }),
      search, box]);
    var users = [];
    function pwBox(u) {
      var out = h('code', { style: 'font-size:13px;word-break:break-all' });
      var b = h('button', { class: 'linkbtn', type: 'button', text: t('f.adm.view'), style: 'margin-right:8px' });
      var shown = false;
      b.onclick = function () {
        if (shown) { out.textContent = ''; b.textContent = t('f.adm.view'); shown = false; return; }
        Auth.api('/api/admin_get_password', { target: u.username }).then(function (res) {
          if (res.body && res.body.ok) { out.textContent = res.body.password; b.textContent = t('f.adm.hide'); shown = true; }
          else if (res.status !== 401) Auth.toast((res.body && res.body.error) || t('f.adm.viewFail'));
        }).catch(function () { Auth.toast(t('auth.offline')); });
      };
      return h('div', { style: 'margin-top:4px' }, [b, out]);
    }
    function draw() {
      var q = search.value.trim().toLowerCase();
      box.textContent = '';
      var rows = users.filter(function (u) { return !q || u.username.toLowerCase().indexOf(q) >= 0; });
      if (!rows.length) box.appendChild(h('div', { class: 'glass empty', text: t('f.adm.none') }));
      rows.forEach(function (u) {
        var btn = u.protected ? h('span', { class: 'tag', text: t('f.adm.isAdmin') })
          : h('button', { class: 'btn warn', type: 'button', text: t('f.adm.force'), onclick: function () {
              Auth.confirmBox(t('f.adm.cf.title'), t('f.adm.cf.text', { u: u.username }), t('f.adm.cf.yes'), true).then(function (ok) {
                if (!ok) return;
                call('admin_delete_user', { target: u.username }).then(function (res) {
                  if (res.body && res.body.ok) { users = users.filter(function (x) { return x.username !== u.username; }); draw(); Auth.toast(t('f.adm.done', { u: u.username })); }
                  else if (res.status !== 401) Auth.toast((res.body && res.body.error) || t('f.del.fail'));
                });
              });
            } });
        box.appendChild(h('div', { class: 'glass item', style: 'display:flex;align-items:center;gap:10px' }, [
          Auth.avatar(u.username, u.av, 36),
          h('div', { style: 'flex:1;min-width:0' }, [
            h('h3', { text: u.username, style: 'margin:0' }),
            h('div', { class: 'meta', text: t('f.adm.counts', { p: u.posts, r: u.replies }) }),
            pwBox(u)
          ]), btn]));
      });
    }
    search.addEventListener('input', draw);
    call('admin_users', {}).then(function (res) {
      if (my !== token) return;
      if (!res.body || !res.body.ok) { box.textContent = ''; if (res.status !== 401) box.appendChild(errorBox(res, function () { route(); })); return; }
      users = res.body.users; draw();
    });
  }

  route();
})();
</script>
</body>
</html>
