<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var LIM = { DM: 500, REASON: 200, IMG_MAX: 2 * 1024 * 1024, FILE_MAX: 25 * 1024 * 1024, ATT_IMGS: 9, ATT_FILES: 5, SHARE_MAX: 20, FOLDER_NAME: 30, TITLE: 60, POST: 2000, REPLY: 300, POLL_OPTS: 10, POLL_OPT_LEN: 40,
              MAX_DEPTH: 2, BIO: 200, TOPICS: 3, TAGS: 5, TAG_LEN: 20, TOPIC_NAME: 20, TOPIC_DESC: 100, FOLDER_NAME: 20,
              SV_TITLE: 60, SV_DESC: 300, SV_Q: 20, SV_Q_LEN: 100, SV_OPTS: 12, SV_OPT_LEN: 60, SV_TEXT: 200 };   // 与后端 forum.js 保持一致
  var keepScroll = false;                                // 评论 / 点赞 / 删除后刷新时保留滚动位置
  var token = 0;                                       // 防止异步结果渲染到已离开的页面

  var t = function (k, p) { return I18n.t(k, p); };
  I18n.mount(document.getElementById('langbtn'));
  Skin.mount(document.getElementById('skinbtn'));
  Theme.mount(document.getElementById('themebtn'));

  /* ---------- 小工具 ---------- */
  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (k === 'text') n.textContent = v;
      else if (k === 'class') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function ago(ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return t('f.ago.now');
    if (s < 3600) return t('f.ago.min', { n: Math.floor(s / 60) });
    if (s < 86400) return t('f.ago.hour', { n: Math.floor(s / 3600) });
    if (s < 86400 * 30) return t('f.ago.day', { n: Math.floor(s / 86400) });
    var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function who(name, av, size) {   // 点头像 / 名字进入对方主页（外面可能套着链接，所以用 span + 点击事件）
    var el = h('span', { class: 'who', style: 'display:inline-flex;align-items:center;gap:6px' }, [Auth.avatar(name, av, size || 22), name]);
    if (name) {
      el.setAttribute('role', 'link'); el.tabIndex = 0; el.title = t('pf.view', { u: name }); el.style.cursor = 'pointer';
      var go = function (e) { e.preventDefault(); e.stopPropagation(); location.hash = '#/u/' + encodeURIComponent(name); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(e); });
    }
    return el;
  }
  function fmtTime(ts) { var d = new Date(ts), z = function (n) { return n < 10 ? '0' + n : n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
  /* 后端带 code 的错误按当前语言显示，其余用后端原文 */
  function errMsg(res, fallback) {
    var b = (res && res.body) || {};
    if (b.code) { var k = 'err.' + b.code, s = t(k); if (s && s !== k) return s; }
    return b.error || fallback;
  }
  function len(s) { return Array.from(s).length; }
  function show(nodes) {
    var y = window.scrollY;
    app.textContent = ''; nodes.forEach(function (n) { if (n) app.appendChild(n); });
    if (keepScroll) { keepScroll = false; window.scrollTo(0, y); } else window.scrollTo(0, 0);
    var on = app.querySelector('.tabs .pill.on'); if (on && on.parentNode.scrollWidth > on.parentNode.clientWidth) on.parentNode.scrollLeft = on.offsetLeft - 40;
  }

  function errorBox(res, retry) {
    var notDeployed = res && (res.status === 404 || res.status === 503);
    var msg = res && res.body && res.body.error;
    return h('div', { class: 'glass errbox' }, [

  /* ---------- 列表筛选 / 排序（状态放在地址里：#/?topic=3&tag=x&sort=likes&dir=asc&q=…） ---------- */

  function renderSurvey(id) {
    var my = token;

    function draw(d) {
      var sv = d.survey, canFill = !d.done && !sv.closed;
      var nodes = [backSv()];
      var title = h('h2', { text: sv.title, style: 'margin:0 0 6px;font-size:21px;overflow-wrap:anywhere' });

      var meta = h('div', { class: 'meta' }, [who(sv.author, sv.av, 26), h('span', { text: ago(sv.created_at) }), h('span', { class: 'cnt', text: t('sv.responses', { n: sv.resp_count }) })]);

      var head = h('div', { class: 'glass post' }, [title, meta]);
      if (sv.descr) head.appendChild(h('p', { class: 'sv-desc', text: sv.descr }));
      head.appendChild(h('p', { class: 'sv-note', text: '🔒 ' + settingsLine(sv.anon, sv.vis, sv.texts_public) }));
      var tools = h('div', { class: 'svtools' });
      if (d.can_results) tools.appendChild(h('a', { class: 'btn', style: 'text-decoration:none', href: '#/s/' + sv.id + '/results', text: t('sv.viewRes') }));
      if (d.owner || d.admin) {
        tools.appendChild(h('button', { class: 'btn', type: 'button', text: sv.closed ? t('sv.reopen') : t('sv.close'), onclick: function () {
          call('survey_close', { id: sv.id }).then(function (r) { if (r.body && r.body.ok) route(); else if (r.status !== 401) Auth.toast(errMsg(r, t('f.del.fail'))); });
        } }));
        tools.appendChild(h('button', { class: 'btn warn', type: 'button', text: t('sv.delete'), onclick: function () {
          Auth.confirmBox(t('sv.delete'), t('sv.del.text'), t('f.del.yes'), true).then(function (ok) {
            if (!ok) return;
            call('survey_delete', { id: sv.id }).then(function (r) { if (r.body && r.body.ok) location.hash = '#/surveys'; else if (r.status !== 401) Auth.toast(errMsg(r, t('f.del.fail'))); });
          });
        } }));
      }
      if (tools.childNodes.length) head.appendChild(tools);
      nodes.push(head);
      if (d.done) nodes.push(h('div', { class: 'rhead', text: '✓ ' + t('sv.done') + ' · ' + t('sv.yourAns') }));

      var getters = [];
      sv.questions.forEach(function (q, i) {
        var card = h('div', { class: 'glass sv-q' });
        var hh = h('h3', {}, [h('span', { class: 'no', text: (i + 1) + '.' }), q.q]);
        if (q.req) hh.appendChild(h('span', { class: 'req', text: '*' }));
        card.appendChild(hh);
        card.appendChild(h('div', { class: 'kind', text: t('sv.t.' + q.t) }));
        var mineAns = d.my_answers ? d.my_answers[i] : null;
        if (q.t === 'text') {
          if (canFill) {
            var ta = h('textarea', { class: 'field', placeholder: t('sv.textPh', { n: LIM.SV_TEXT }), maxlength: String(LIM.SV_TEXT * 2) });
            card.appendChild(ta); getters.push(function () { var v = ta.value.trim(); return v ? v : null; });
          } else {
            card.appendChild(h('div', { class: 'opt mine' }, [h('span', { text: mineAns || t('sv.noAns') })]));
          }
        } else {
          var picked = [];
          q.opts.forEach(function (o, k) {
            if (canFill) {
              var inp = h('input', { type: q.t === 'multi' ? 'checkbox' : 'radio', name: 'q' + i });
              picked.push(inp);
              card.appendChild(h('label', { class: 'opt' }, [inp, h('span', { text: o })]));
            } else {
              var mine = q.t === 'multi' ? (Array.isArray(mineAns) && mineAns.indexOf(k) >= 0) : mineAns === k;
              card.appendChild(h('div', { class: 'opt' + (mine ? ' mine' : '') }, [h('span', { text: (mine ? '✓ ' : '') + o })]));
            }
          });
          if (canFill) {
            getters.push(function () {
              var sel = []; picked.forEach(function (x, k) { if (x.checked) sel.push(k); });
              if (q.t === 'multi') return sel;
              return sel.length ? sel[0] : null;
            });
          }

        nodes.push(card);
      });

      if (canFill) {
        var msg = h('div', { class: 'formmsg' });
        var send = h('button', { class: 'btn primary', type: 'button', text: t('sv.submit') });
        send.onclick = function () {
          var ans = getters.map(function (g) { return g(); });
          for (var i = 0; i < sv.questions.length; i++) {
            var q = sv.questions[i], a = ans[i];
            if (q.req && (a === null || (Array.isArray(a) && !a.length))) { msg.textContent = t('sv.e.required', { n: i + 1 }); return; }
          }
          send.disabled = true; msg.textContent = '';
          call('survey_submit', { id: sv.id, answers: ans }).then(function (r) {
            send.disabled = false;
            if (r.body && r.body.ok) { Auth.toast(t('sv.thanks')); route(); }
            else if (r.status !== 401) msg.textContent = errMsg(r, t('f.e.pubfail'));
          });
        };
        nodes.push(h('div', { class: 'actions', style: 'justify-content:flex-end' }, [send]), msg);
      }
      show(nodes);
    }
  }

    document.body.appendChild(mask);
  }
  function renderDriveShared() {

          listEl.appendChild(h('div', { class: 'glass item driverow' }, [h('div', { style: 'min-width:0;flex:1' }, [h('strong', { text: '📎 ' + f.name, style: 'overflow-wrap:anywhere' }), h('div', { class: 'meta', style: 'display:flex;align-items:center;gap:6px;flex-wrap:wrap' }, [who(f.owner, f.av, 18), fmtSize(f.size) + ' · ' + fmtTime(f.created_at)])]), h('div', { class: 'dact' }, [dl])]));

  /* ---------- 私信 ---------- */
  var dmUnread = 0, dmTimer = null;

  }

  function dmNote() { return h('p', { class: 'meta', style: 'margin:8px 0 12px;overflow-wrap:anywhere', text: 'ℹ️ ' + t('dm.note') }); }

  function renderDmList() {

          Auth.avatar(c.peer, c.av, 40),
          h('div', { style: 'flex:1;min-width:0' }, [
            h('div', { style: 'display:flex;justify-content:space-between;gap:8px' }, [h('strong', { text: c.peer, style: 'overflow-wrap:anywhere' }), h('span', { class: 'meta', text: ago(c.last.created_at) })]),
            h('div', { class: 'meta', style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap', text: preview })]),
          c.unread ? h('b', { class: 'dmbadge', text: String(c.unread), style: 'display:inline-block' }) : null]));

  }

  function renderChat(peer) {
    var my = token;
    var back = h('div', { class: 'head' }, [h('a', { class: 'pill', href: '#/dm', text: t('dm.title') })]);
    var msgsEl = h('div', { class: 'chat' });
    var older = h('button', { class: 'btn more', type: 'button', text: t('dm.older'), style: 'display:none;margin:0 auto 8px' });
    var bar = h('div', { class: 'glass profile', style: 'display:flex;align-items:center;gap:10px;margin-bottom:8px' });
    var foot = h('div', { class: 'chatfoot' });

    var me = Auth.user(), lastId = 0, firstId = 0, peerRead = 0, iBlocked = false, picking = false, picked = {}, timer = null, drawn = {};
    var errEl = document.getElementById('dmerr');

    function stop() { clearInterval(timer); timer = null; }
    function msgNode(m) {
      var row = h('div', { class: 'cmsg ' + (m.mine ? 'mine' : 'theirs'), 'data-id': String(m.id) });
      var inner = [];
      if (picking && !m.mine && !m.recalled) {
        var c = h('input', { type: 'checkbox' }); c.checked = !!picked[m.id];
        c.onchange = function () { if (c.checked) picked[m.id] = 1; else delete picked[m.id]; };
        inner.push(c);
      }
      if (m.recalled) inner.push(h('i', { class: 'meta', text: t(m.mine ? 'dm.recalled.mine' : 'dm.recalled.theirs') }));
      else {
        if (m.body) inner.push(h('div', { class: 'bub', text: m.body }));
        var ab = attBox(m.atts); if (ab) inner.push(ab);
        var meta = [fmtTime(m.created_at)];
        if (m.mine && m.id <= peerRead) meta.push(t('dm.read'));
        var mt = h('div', { class: 'meta', text: meta.join(' · ') });
        if (m.mine && Date.now() - m.created_at < 600000) mt.appendChild(h('button', { class: 'linkbtn', type: 'button', style: 'margin-left:8px', text: t('dm.recall'), onclick: function () {
          call('dm_recall', { id: m.id }).then(function (r) { if (r.body && r.body.ok) { m.recalled = true; m.body = ''; row.replaceWith(msgNode(m)); } else if (r.status !== 401) Auth.toast(errMsg(r, t('f.del.fail'))); });
        } }));
        inner.push(mt);
      }
      inner.forEach(function (n) { row.appendChild(n); });
      row._m = m;
      return row;
    }
    function add(list, prepend) {
      var near = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 120;
      var frag = document.createDocumentFragment();
      list.forEach(function (m) { if (drawn[m.id]) return; drawn[m.id] = 1; frag.appendChild(msgNode(m)); lastId = Math.max(lastId, m.id); firstId = firstId ? Math.min(firstId, m.id) : m.id; });
      if (prepend) msgsEl.insertBefore(frag, msgsEl.firstChild); else { msgsEl.appendChild(frag); if (near || !lastId) window.scrollTo(0, document.documentElement.scrollHeight); }
    }
    function redraw() { var all = Array.prototype.map.call(msgsEl.children, function (n) { return n._m; }); msgsEl.textContent = ''; drawn = {}; var l = lastId, f = firstId; lastId = 0; firstId = 0; add(all, false); lastId = Math.max(lastId, l); firstId = f || firstId; }

    function drawBar() {
      bar.textContent = '';

      var menu = h('div', { style: 'margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end' });
      menu.appendChild(h('button', { class: 'btn', type: 'button', text: t('dm.report'), onclick: function () { picking = !picking; picked = {}; drawBar(); drawFoot(); redraw(); } }));
      menu.appendChild(h('button', { class: 'btn', type: 'button', text: t('dm.clear'), onclick: function () {
        Auth.confirmBox(t('dm.clear'), t('dm.clear.text'), t('dm.clear'), true).then(function (ok) { if (ok) call('dm_clear', { with: peer }).then(function () { route(); }); });
      } }));
      menu.appendChild(h('button', { class: 'btn' + (iBlocked ? '' : ' warn'), type: 'button', text: t(iBlocked ? 'dm.unblock' : 'dm.block'), onclick: function () {
        var go = function () { call('block', { name: peer, on: !iBlocked }).then(function (r) { if (r.body && r.body.ok) { iBlocked = !iBlocked; drawBar(); drawFoot(); } else if (r.status !== 401) Auth.toast(errMsg(r, t('f.del.fail'))); }); };
        if (iBlocked) go(); else Auth.confirmBox(t('dm.block'), t('dm.block.text'), t('dm.block'), true).then(function (ok) { if (ok) go(); });
      } }));
      bar.appendChild(menu);
    }
    var peerAv = null;
    function drawFoot() {
      foot.textContent = '';
      if (picking) {
        var reason = h('input', { class: 'field', type: 'text', placeholder: t('dm.report.reason', { n: LIM.REASON }), maxlength: String(LIM.REASON * 2) });
        var send = h('button', { class: 'btn primary', type: 'button', text: t('dm.report.send') });
        send.onclick = function () {
          var ids = Object.keys(picked).map(Number);
          if (!ids.length) { errEl.textContent = t('err.report_none'); return; }
          send.disabled = true;
          call('dm_report', { with: peer, ids: ids, reason: reason.value.trim() }).then(function (r) {
            send.disabled = false;
            if (r.body && r.body.ok) { Auth.toast(t('dm.report.done')); picking = false; picked = {}; errEl.textContent = ''; drawBar(); drawFoot(); redraw(); }
            else if (r.status !== 401) errEl.textContent = errMsg(r, t('f.loadFail'));

        foot.appendChild(h('div', { class: 'meta', text: t('dm.report.pick'), style: 'margin-bottom:6px' }));

        foot.appendChild(h('div', { class: 'actions', style: 'margin-top:8px' }, [h('button', { class: 'btn', type: 'button', text: t('dm.cancel'), onclick: function () { picking = false; picked = {}; drawBar(); drawFoot(); redraw(); } }), send]));
        return;
      }

        if (!r.body.reports.length) listEl.appendChild(h('div', { class: 'glass empty' }, [h('span', { class: 'em', text: '✅' }), h('strong', { text: t('rp.empty') })]));

          rp.msgs.forEach(function (m) { card.appendChild(h('div', { class: 'cmsg ' + (m.sender === rp.reporter ? 'mine' : 'theirs') }, [h('div', { class: 'meta', text: m.sender + ' · ' + fmtTime(m.created_at) }), h('div', { class: 'bub', text: m.body })])); });

            card.appendChild(note);

              call('report_handle', { id: rp.id, note: note.value.trim() }).then(function (x) { if (x.body && x.body.ok) card.remove(); else if (x.status !== 401) Auth.toast(errMsg(x, t('f.del.fail'))); });
            } })]));

    }

  }

  route();
})();
