<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2901班 官网</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="shared/site.css">
<style>
  .hero {
    position: relative; overflow: hidden;
    max-width: 880px; margin: 10px auto 0;
    border-radius: 28px; padding: 40px 26px 44px;
    background: linear-gradient(160deg, var(--color-sky) 0%, #3FA9E8 55%, var(--color-grass) 130%);
    color: #fff;
  }
  .lanes {
    position: absolute; inset: 0; opacity: .16;
    background: repeating-linear-gradient(180deg, transparent 0 34px, #fff 34px 38px);
    transform: skewY(-3deg) scale(1.2); pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4);
    padding: 5px 14px 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 500;
  }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--color-sun); box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .hero h1 {
    font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-weight: 400;
    font-size: clamp(42px, 13vw, 72px); line-height: 1.05; margin: 16px 0 8px; letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,.1);
  }
  .hero p { margin: 0; font-size: 15px; max-width: 28em; opacity: .95; line-height: 1.7; }
  .hello { margin-top: 18px; font-size: 14px; min-height: 22px; opacity: .95; }
  .hello b { font-weight: 700; }

  main { max-width: 880px; margin: 0 auto; padding: 22px 18px 20px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .tile {
    display: flex; flex-direction: column; gap: 6px;
    padding: 20px 18px 18px; text-decoration: none; color: inherit;
    transition: transform .15s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-3px); }
  .tile:focus-visible { outline: 2px solid var(--color-sky); outline-offset: 3px; }
  .badge {
    width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin-bottom: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
  }
  .tile.sports .badge { background: color-mix(in srgb, var(--color-sun) 30%, transparent); }
  .tile.game .badge { background: color-mix(in srgb, var(--color-track) 24%, transparent); }
  .tile.forum .badge { background: color-mix(in srgb, var(--color-grass) 26%, transparent); }
  .tile h2 { margin: 0; font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-weight: 400; font-size: 24px; }
  .tile p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--color-ink-soft); flex: 1; }
  .tile .go { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--color-sky); }
  .tile.game .go { color: var(--color-track); }
  .tile.forum .go { color: var(--color-grass); }
  .note { margin: 18px 4px 0; font-size: 12.5px; color: var(--color-ink-soft); line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="topbar">
  <span class="pill" style="cursor:default">🏫 2901班</span>
  <div id="authbar"></div>
</header>

<div class="hero">
  <div class="lanes"></div>
  <div class="hero-inner">
    <span class="eyebrow"><i></i>班级主页</span>
    <h1 class="display">2901班 官网</h1>
    <p>运动会的荣誉、课间的小游戏、大家聊天的地方，都在这里。</p>
    <div class="hello" id="hello"></div>
  </div>
</div>

<main>
  <nav class="grid" aria-label="站内导航">
    <a class="tile glass sports" href="sports/">
      <div class="badge">🏆</div>
      <h2>运动会统计</h2>
      <p>每一枚奖牌、每一分团体积分，一页看全。</p>
      <span class="go">查看荣誉榜 →</span>
    </a>
    <a class="tile glass game" href="school/">
      <div class="badge">🎮</div>
      <h2>游戏</h2>
      <p>辽宁省中学大战：14 所学校对碰，为你的学校赢积分、上排行榜。</p>
      <span class="go">开始游戏 →</span>
    </a>
    <a class="tile glass forum" href="forum/">
      <div class="badge">💬</div>
      <h2>论坛</h2>
      <p>发帖、回帖，聊学习也聊八卦。登录后即可参与。</p>
      <span class="go">进入论坛 →</span>
    </a>
  </nav>
  <p class="note">一个账号通用：在首页、游戏或论坛任意一处登录，其它页面会自动保持登录状态。</p>
</main>

<footer class="site-foot">2901 班 · 官网</footer>

<script src="shared/auth.js"></script>
<script>
  Auth.mountBar(document.getElementById('authbar'));
  function hello() {
    var el = document.getElementById('hello');
    el.textContent = '';
    if (Auth.isLoggedIn()) {
      el.appendChild(document.createTextNode('👋 欢迎回来，'));
      var b = document.createElement('b'); b.textContent = Auth.user(); el.appendChild(b);
    } else {
      el.textContent = '登录后可以玩游戏、上排行榜、参与论坛讨论。';
    }
  }
  hello();
  Auth.onChange(hello);
</script>
</body>
</html>
